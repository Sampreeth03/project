openapi: 3.0.3
info:
  title: Project Backend API - Member5
  version: 1.0.0
  description: Member5 endpoints only.
servers:
  - url: /
    description: Relative to deployment origin

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: Member5

paths:
  /api/platform-admin/login:
    post:
      tags: [Member5]
      summary: Platform admin login
      operationId: loginPlatformAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAdminLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /api/platform-admin/session:
    get:
      tags: [Member5]
      summary: Get current platform admin session
      operationId: getPlatformAdminSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/platform-admin/logout:
    post:
      tags: [Member5]
      summary: Logout current platform admin session
      operationId: logoutPlatformAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/platform-admin/summary:
    get:
      tags: [Member5]
      summary: Platform admin summary
      operationId: getPlatformAdminSummary
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/platform-admin/recruiters:
    get:
      tags: [Member5]
      summary: Recruiters pending verification
      operationId: getRecruitersForVerification
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/platform-admin/recruiters/{id}:
    get:
      tags: [Member5]
      summary: Get recruiter verification detail
      operationId: getRecruiterVerificationDetail
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/platform-admin/recruiters/{id}/verify:
    post:
      tags: [Member5]
      summary: Verify recruiter
      operationId: updateRecruiterVerification
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/platform-admin/recruiters/bulk-verify:
    post:
      tags: [Member5]
      summary: Bulk verify or request re-upload for recruiters
      operationId: bulkUpdateRecruiterVerification
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/platform-admins:
    get:
      tags: [Member5]
      summary: List platform administrators
      operationId: getPlatformAdministrators
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Platform administrators fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAdministratorsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    post:
      tags: [Member5]
      summary: Create a new platform administrator
      operationId: createPlatformAdministrator
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformAdminRequest'
      responses:
        '201':
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlatformAdminResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: platform_admin_token

  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          nullable: true
      required: [success]

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Operation failed
        error:
          nullable: true
      required: [success, message]

    PlatformAdminLoginRequest:
      type: object
      required: [email, passkey, adminId]
      properties:
        email:
          type: string
          format: email
          example: platform.admin@example.com
        passkey:
          type: string
          example: SuperSecretPasskey123
        adminId:
          type: string
          example: PA-001

    AuthPayload:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            token:
              type: string
            user:
              type: object
              additionalProperties: true

    PlatformAdministrator:
      type: object
      properties:
        _id:
          type: string
        adminId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
      additionalProperties: true

    PlatformAdministratorsResponse:
      type: object
      properties:
        success:
          type: boolean
        admins:
          type: array
          items:
            $ref: '#/components/schemas/PlatformAdministrator'
      required: [success]

    CreatePlatformAdminRequest:
      type: object
      required: [name, email, adminId]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        adminId:
          type: string

    CreatePlatformAdminResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        admin:
          $ref: '#/components/schemas/PlatformAdministrator'
      required: [success]

  responses:
    SuccessResponse:
      description: Generic success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccess'

    ErrorResponse:
      description: Generic error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    AuthResponse:
      description: Authentication success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthPayload'
