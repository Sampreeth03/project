      x-implemented-by:
        controller: source/controllers/userController.js#completeOnboarding
        route: source/routes/userRoutes.js

  /api/not:
    get:
      tags: [Member1-Notifications]
      summary: Project notifications shell endpoint
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Notifications shell response.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/doubtController.js#getProjectNotifications
        route: source/routes/doubtRoutes.js

  /api/notifications:
    get:
      tags: [Member1-Notifications]
      summary: Fetch project notifications JSON
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Project notification inbox payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNotificationsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/doubtController.js#getProjectNotificationsJSON
        route: source/routes/doubtRoutes.js

  /api/doubt:
    get:
      tags: [Member1-Doubts]
      summary: Doubt board shell endpoint
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Doubt board shell rendered successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/doubtController.js#getDoubtBoard
        route: source/routes/doubtRoutes.js

  /api/clear:
    get:
      tags: [Member1-Doubts]
      summary: Clear doubts shell endpoint
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Clear doubts shell rendered successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/doubtController.js#getClearDoubts
        route: source/routes/doubtRoutes.js

  /api/doubts:
    get:
      tags: [Member1-Doubts]
      summary: Fetch doubts as JSON
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Doubts list fetched.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/doubtController.js#getDoubtsJSON
        route: source/routes/doubtRoutes.js

  /api/ask:
    post:
      tags: [Member1-Doubts]
      summary: Post a new doubt
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Doubt post attempted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/doubtController.js#postDoubt
        route: source/routes/doubtRoutes.js

  /api/reply:
    post:
      tags: [Member1-Doubts]
      summary: Reply to a doubt
      security:
