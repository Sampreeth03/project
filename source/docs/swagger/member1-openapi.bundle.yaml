        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/messageController.js#sendChannelMessage
        route: source/routes/messageRoutes.js

  /api/messages/projects/{projectId}/direct-messages/{otherUserId}:
