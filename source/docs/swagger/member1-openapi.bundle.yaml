      x-implemented-by:
        controller: source/controllers/messageController.js#getUserProjects
        route: source/routes/messageRoutes.js

  /api/messages/projects/{projectId}/channels:
    get:
      tags: [Member1-Messaging]
      summary: List channels for a project
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Channel list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectChannelsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/messageController.js#getProjectChannels
        route: source/routes/messageRoutes.js

    post:
      tags: [Member1-Messaging]
      summary: Create channel in project (creator only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '200':
          description: Channel create status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectChannelsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
