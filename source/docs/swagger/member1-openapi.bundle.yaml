    post:
      tags: [Member1-Messaging]
      summary: Send channel message
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendChannelMessageRequest'
      responses:
        '200':
          description: Message send status.
          content:
            application/json:
