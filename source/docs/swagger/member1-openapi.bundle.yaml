openapi: 3.0.3
info:
  title: RELABTeams Member 1 User APIs
  version: 1.0.0
  description: Bundled OpenAPI file for Member 1 user-related endpoints (excluding login and registration).
servers:
  - url: /
    description: Relative to deployment origin
paths:
  /api/home:
    get:
      tags: [Member1-Home]
      summary: Get user home/session payload
      description: Returns session and onboarding/profile-completion state for the current user, or null user when not signed in.
      security: []
      responses:
        '200':
          description: Home payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getHome
        route: source/routes/userRoutes.js

  /api/home/topics:
    get:
      tags: [Member1-Home]
      summary: List home topics
      description: Returns static topic cards for the home page.
      security: []
      responses:
        '200':
          description: Topic list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getHomeTopics
        route: source/routes/userRoutes.js

  /api/dashboard:
    get:
      tags: [Member1-Dashboard]
      summary: Get dashboard shell status
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard shell payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleShellResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/userController.js#getDashboard
        route: source/routes/userRoutes.js

  /api/dashboard-metrics:
    get:
      tags: [Member1-Dashboard]
      summary: Get user dashboard metrics
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard metrics and chart payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMetricsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getDashboardMetrics
        route: source/routes/userRoutes.js

  /api/dashboard-trends:
    get:
      tags: [Member1-Dashboard]
      summary: Get user dashboard trends
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Trend analytics payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTrendsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getDashboardTrends
        route: source/routes/userRoutes.js

  /api/profile:
    get:
      tags: [Member1-Profile]
      summary: Get current-user profile shell status
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Profile shell payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleShellResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/userController.js#getProfile
        route: source/routes/userRoutes.js

    post:
      tags: [Member1-Profile]
      summary: Update current-user profile
      description: Updates name/email/about/skills/interests and optional profile picture and resume.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#postProfile
        route: source/routes/userRoutes.js

  /api/profile/{id}:
    get:
      tags: [Member1-Profile]
      summary: Get profile shell status for user id
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Profile shell payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleShellResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/userController.js#getProfile
        route: source/routes/userRoutes.js

  /api/profile-data/{id}:
    get:
      tags: [Member1-Profile]
      summary: Get profile data by user id
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Detailed profile payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDataResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getProfileData
        route: source/routes/userRoutes.js

  /api/users/search:
    get:
      tags: [Member1-Friends]
      summary: Search users for friend connections
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Matching users and relationship state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchUsersResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#searchUsers
        route: source/routes/userRoutes.js

  /api/friend-request/send:
    post:
      tags: [Member1-Friends]
      summary: Send friend request
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestSendRequest'
      responses:
        '200':
          description: Friend request result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#sendFriendRequest
        route: source/routes/userRoutes.js

  /api/friend-request/respond:
    post:
      tags: [Member1-Friends]
      summary: Accept or reject friend request
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestRespondRequest'
      responses:
        '200':
          description: Friend request action applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Request does not belong to current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#respondFriendRequest
        route: source/routes/userRoutes.js

  /api/friends:
    get:
      tags: [Member1-Friends]
      summary: List accepted friends
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Accepted friends list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getFriends
        route: source/routes/userRoutes.js

  /api/friend-requests:
    get:
      tags: [Member1-Friends]
      summary: List incoming pending friend requests
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Pending friend requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getFriendRequests
        route: source/routes/userRoutes.js

  /api/messages:
    get:
      tags: [Member1-General]
      summary: Get messages shell status
      description: Returns shell payload for messages page.
      security: []
      responses:
        '200':
          description: Messages shell payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleShellResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getMessages
        route: source/routes/userRoutes.js

  /api/FAQ:
    get:
      tags: [Member1-General]
      summary: Get FAQ shell status
      description: Returns shell payload for FAQ page.
      security: []
      responses:
        '200':
          description: FAQ shell payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleShellResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getFAQ
        route: source/routes/userRoutes.js

  /api/complete-onboarding:
    post:
      tags: [Member1-General]
      summary: Mark current user onboarding as completed
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Onboarding completion status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteOnboardingResponse'
        '401':
