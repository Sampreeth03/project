      tags: [Member1-Messaging]
      summary: List direct messages between two project members
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/OtherUserIdPath'
      responses:
        '200':
