        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Reply post attempted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/doubtController.js#postReply
        route: source/routes/doubtRoutes.js

  /api/messages/projects:
    get:
      tags: [Member1-Messaging]
      summary: List active projects visible in group chat
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Chat project list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageProjectsResponse'
        '401':
