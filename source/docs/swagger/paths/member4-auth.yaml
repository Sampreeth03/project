        controller: source/controllers/authController.js#getLanding
        route: source/routes/authRoutes.js
      x-frontend-consumers:
        - client/src/components/landing/Landing.jsx

  /login:
    get:
      tags: [Auth]
      summary: Login API health endpoint
      operationId: getLoginStatus
