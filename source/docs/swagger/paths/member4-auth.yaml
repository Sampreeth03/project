        controller: source/controllers/authController.js#getLogin
        route: source/routes/authRoutes.js
      x-frontend-consumers:
        - client/src/components/Auth/Login.jsx

    post:
      tags: [Auth]
      summary: Legacy direct login
      description: Authenticates using email and password and returns JWT cookie in one step.
      operationId: postLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/member4-schemas.yaml#/components/schemas/LoginRequest
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/LoginSuccessResponse
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/ErrorResponse
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/ErrorResponse
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/ErrorResponse
      x-implemented-by:
        controller: source/controllers/authController.js#postLogin
        route: source/routes/authRoutes.js
      x-frontend-consumers:
        - client/src/components/Auth/Login.jsx

  /login/request-otp:
    post:
      tags: [Auth]
      summary: Request OTP for login
      operationId: postLoginRequestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/member4-schemas.yaml#/components/schemas/LoginRequest
      responses:
        '200':
          description: OTP sent or OTP skipped for default users.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/LoginSuccessResponse
        '400':
          description: Validation failure.
          content:
            application/json:
