components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
      description: Project id

    TaskIdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
      description: Task id

    TaskIdPathNamed:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
      description: Task id

    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
      description: Join request id

  responses:
    UnauthorizedError:
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthorized

    ForbiddenError:
      description: Forbidden request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthorized

    NotFoundError:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Project not found

    BadRequestError:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Invalid request

    TopicProjectsResponse:
      description: Topic projects fetched
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TopicProjectsResponse'

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 507f1f77bcf86cd799439011

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
      additionalProperties: true

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
      required: [success]

    BooleanSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required: [success]

    MessageOrSuccessResponse:
      oneOf:
        - $ref: '#/components/schemas/BooleanSuccessResponse'
        - $ref: '#/components/schemas/MessageResponse'

    RequirePaymentResponse:
      type: object
      properties:
        requirePayment:
          type: boolean
          example: true
      required: [requirePayment]

    UserCompact:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        role:
          type: string
          example: user

    ProjectSummary:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        description:
          type: string
        topic:
          type: string
        capacity:
          type: integer
          minimum: 1
        member_count:
          type: integer
        memberCount:
          type: integer
        status:
          type: string
        createdBy:
          type: string
        hasJoined:
          type: boolean
        hasPendingRequest:
          type: boolean
        has_pending_request:
          type: boolean
        request_status:
          type: string
          nullable: true
        deadline:
          type: string
      additionalProperties: true

    ProjectMember:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        project_id:
          $ref: '#/components/schemas/ObjectId'
        user_id:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: object
              properties:
                _id:
                  $ref: '#/components/schemas/ObjectId'
                name:
                  type: string
                email:
                  type: string
      additionalProperties: true

    Task:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        id:
          $ref: '#/components/schemas/ObjectId'
        project_id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        description:
          type: string
        status:
          type: string
        due_date:
          type: string
          format: date-time
        assigned_to:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: object
              properties:
                _id:
                  $ref: '#/components/schemas/ObjectId'
                name:
                  type: string
        github_link:
          type: string
          nullable: true
        feedback:
          type: string
          nullable: true
      additionalProperties: true

    Notification:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        user_id:
          $ref: '#/components/schemas/ObjectId'
        message:
          type: string
        type:
          type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: true

    JoinRequest:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        project_id:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/ProjectSummary'
        user_id:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: object
              properties:
                _id:
                  $ref: '#/components/schemas/ObjectId'
                name:
                  type: string
        status:
          type: string
          enum: [pending, approved, rejected]
      additionalProperties: true

    JoinRequestMessage:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        join_request_id:
          $ref: '#/components/schemas/ObjectId'
        sender_id:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: object
              properties:
                _id:
                  $ref: '#/components/schemas/ObjectId'
                name:
                  type: string
        receiver_id:
          $ref: '#/components/schemas/ObjectId'
        message:
          type: string
        file_url:
          type: string
          nullable: true
        file_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: true

    FinishEligibilityRules:
      type: object
      properties:
        minTasksRequired:
          type: integer
        minAssigneesRequired:
          type: integer
        totalTasks:
          type: integer
        completedTasks:
          type: integer
        nonCompletedTasks:
          type: integer
        assignedMemberCount:
          type: integer
        isHalfwayReached:
          type: boolean
        halfwayDate:
          type: string
          format: date-time
          nullable: true
        deadline:
          type: string
          nullable: true

    FinishEligibility:
      type: object
      properties:
        eligible:
          type: boolean
        rules:
          $ref: '#/components/schemas/FinishEligibilityRules'
        reasons:
          type: array
          items:
            type: string

    GetAllProjectsResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/UserCompact'
        createdProjects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        availableProjects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
      required: [success, createdProjects, availableProjects]

    GetJoinedProjectsResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/UserCompact'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        tasksByProject:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Task'

    GetProjectDetailsResponse:
      type: object
      properties:
        success:
          type: boolean
        project:
          $ref: '#/components/schemas/ProjectSummary'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        projectMembers:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        userProjects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'

    GetCreateProjectViewResponse:
      type: object
      properties:
        success:
          type: boolean
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'

    CreateProjectRequest:
      type: object
      required: [title, description, capacity, topic, deadline]
      properties:
        title:
          type: string
        description:
          type: string
        capacity:
          type: integer
          minimum: 1
        topic:
          type: string
        deadline:
          type: string
          format: date

    CreateProjectResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        projectId:
          $ref: '#/components/schemas/ObjectId'

    DeleteProjectRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          $ref: '#/components/schemas/ObjectId'

    JoinProjectRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          $ref: '#/components/schemas/ObjectId'

    JoinRequestActionRequest:
      type: object
      required: [requestId]
      properties:
        requestId:
          $ref: '#/components/schemas/ObjectId'

    InviteFriendRequest:
      type: object
      required: [projectId, toUserId]
      properties:
        projectId:
          $ref: '#/components/schemas/ObjectId'
        toUserId:
          $ref: '#/components/schemas/ObjectId'

    RespondInviteRequest:
      type: object
      required: [inviteId, action]
      properties:
        inviteId:
          $ref: '#/components/schemas/ObjectId'
        action:
          type: string
          enum: [accept, reject]

    GetProjectInvitesResponse:
      type: object
      properties:
        invites:
          type: array
          items:
            type: object
            additionalProperties: true

    GetPendingTasksResponse:
      type: object
      properties:
        success:
          type: boolean
        pendingTasks:
          type: integer
        finishEligibility:
          $ref: '#/components/schemas/FinishEligibility'

    RemoveProjectMemberRequest:
      type: object
      required: [projectId, userId]
      properties:
        projectId:
          $ref: '#/components/schemas/ObjectId'
        userId:
          $ref: '#/components/schemas/ObjectId'

    CreateTaskRequest:
      type: object
      required: [projectId, title, dueDate]
      properties:
        projectId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        description:
          type: string
        assignedTo:
          $ref: '#/components/schemas/ObjectId'
        dueDate:
          type: string
          format: date

    CreateTaskResponse:
      type: object
      properties:
        success:
          type: boolean
        task:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            title:
              type: string
            status:
              type: string

    ExtendDeadlineRequest:
      type: object
      required: [taskTitle, projectId, newDueDate]
      properties:
        taskTitle:
          type: string
        projectId:
          $ref: '#/components/schemas/ObjectId'
        newDueDate:
          type: string
          format: date

    SubmitGithubLinkRequest:
      type: object
      required: [taskId, githubLink, projectId]
      properties:
        taskId:
          $ref: '#/components/schemas/ObjectId'
        githubLink:
          type: string
          format: uri
        projectId:
          $ref: '#/components/schemas/ObjectId'

    ReviewSubmissionRequest:
      type: object
      required: [taskId, projectId, action, feedback]
      properties:
        taskId:
          $ref: '#/components/schemas/ObjectId'
        projectId:
          $ref: '#/components/schemas/ObjectId'
        action:
          type: string
          enum: [accept, reject]
        feedback:
          type: string

    ReviewSubmissionPathRequest:
      type: object
      required: [projectId, action, feedback]
      properties:
        projectId:
          $ref: '#/components/schemas/ObjectId'
        action:
          type: string
          enum: [accept, reject]
        feedback:
          type: string

    ReviewSubmissionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        task:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            status:
              type: string
            feedback:
              type: string

    GetTaskProjectResponse:
      type: object
      properties:
        success:
          type: boolean
        projectId:
          $ref: '#/components/schemas/ObjectId'

    SendJoinRequestMessageRequest:
      type: object
      required: [requestId, message]
      properties:
        requestId:
          $ref: '#/components/schemas/ObjectId'
        message:
          type: string

    SendJoinRequestMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          $ref: '#/components/schemas/JoinRequestMessage'

    UploadJoinRequestFileRequest:
      type: object
      required: [requestId, file]
      properties:
        requestId:
          $ref: '#/components/schemas/ObjectId'
        file:
          type: string
          format: binary

    GetJoinRequestMessagesResponse:
      type: object
      properties:
        success:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/JoinRequestMessage'
        joinRequest:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            applicantName:
              type: string
            projectName:
              type: string
            status:
              type: string

    TopicProjectsResponse:
      type: object
      properties:
        success:
          type: boolean
        topic:
          type: string
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
