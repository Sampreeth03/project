  postman_swagger_ui_authenticated_plan:
    prerequisites:
      - Start backend at source folder using node server.js
      - Start frontend at client folder using npm run dev
      - Login as seeded user account to obtain auth cookie
    test_sequence:
      - name: Create project
        endpoint: POST /api/create-project
        expected: success true with projectId or requirePayment true
      - name: List projects
        endpoint: GET /api/project
        expected: createdProjects and availableProjects arrays
      - name: Join flow
        endpoint: POST /api/join-project
        expected: success true or informative duplicate/full/own-project message
      - name: Approve or reject join request
        endpoint: POST /api/approve-join-request or /api/reject-join-request
        expected: success true and notification side effects
      - name: Invite and respond
        endpoint: POST /api/project/invite-friend then POST /api/project/invite/respond
        expected: success true and membership update on accept
      - name: Task workflow
        endpoint: POST /api/task/create, /api/task/submit-github-link, /api/task/review-submission
        expected: task status transitions In Progress -> Review -> Completed or back to In Progress
      - name: Finish project
        endpoint: GET /api/project/{id}/pending-tasks then POST /api/project/{id}/finish
        expected: finish blocked until eligibility true, then success
      - name: Remove member
        endpoint: POST /api/project/remove-member
        expected: success true for creator, forbidden for non-creator

  notes:
    - Topic routes are dynamic and sourced from constants map.
    - All endpoints in projectRoutes.js are currently stateless JSON APIs behind cookie-based authentication middleware.
