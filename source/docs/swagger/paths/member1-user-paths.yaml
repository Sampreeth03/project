  /api/messages/messages/{messageId}/pin:
    post:
      tags: [Member1-Messaging]
      summary: Toggle pin status for a message (owner only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageIdPath'
      responses:
        '200':
          description: Pin status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinToggleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implemented-by:
        controller: source/controllers/messageController.js#togglePinMessage
        route: source/routes/messageRoutes.js

  /api/messages/channels/{channelId}/pinned:
    get:
      tags: [Member1-Messaging]
      summary: List pinned messages in channel
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelIdPath'
      responses:
        '200':
          description: Pinned message list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedMessagesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      x-implemented-by:
        controller: source/controllers/messageController.js#getPinnedMessages
        route: source/routes/messageRoutes.js
