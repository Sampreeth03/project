  /api/home:
    get:
      tags: [Member1-Home]
      summary: Get user home/session payload
      description: Returns session and onboarding/profile-completion state for the current user, or null user when not signed in.
      security: []
      responses:
        '200':
          description: Home payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getHome
        route: source/routes/userRoutes.js

  /api/home/topics:
    get:
      tags: [Member1-Home]
      summary: List home topics
      description: Returns static topic cards for the home page.
      security: []
