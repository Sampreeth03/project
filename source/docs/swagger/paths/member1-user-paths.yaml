        '200':
          description: Topic list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
      x-implemented-by:
        controller: source/controllers/userController.js#getHomeTopics
        route: source/routes/userRoutes.js

