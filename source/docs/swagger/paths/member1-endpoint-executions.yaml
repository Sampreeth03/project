x-member1-endpoint-executions:
  execution_date: 2026-04-02
  execution_mode:
    unauthenticated_smoke:
      tool: curl
      base_url: http://localhost:5000
      expected:
        - 200 for public endpoints
        - 401 for auth-protected user endpoints
      note: Execute from source folder while backend is running.

  smoke_plan:
    public_expected_200:
      - method: GET
        path: /api/home
      - method: GET
        path: /api/home/topics
      - method: GET
        path: /api/messages
      - method: GET
        path: /api/FAQ

    protected_expected_401_without_auth:
      - method: GET
        path: /api/dashboard
      - method: GET
        path: /api/dashboard-metrics
      - method: GET
        path: /api/dashboard-trends
      - method: GET
        path: /api/profile
      - method: GET
        path: /api/profile/{id}
      - method: GET
        path: /api/profile-data/{id}
      - method: GET
        path: /api/users/search?q=test
      - method: POST
        path: /api/friend-request/send
      - method: POST
        path: /api/friend-request/respond
      - method: GET
        path: /api/friends
      - method: GET
        path: /api/friend-requests

  postman_swagger_ui_authenticated_plan:
    prerequisites:
      - Start backend from source folder using node server.js
      - Login as user account to obtain auth cookie
    test_sequence:
      - name: Home/session payload
        endpoint: GET /api/home
        expected: success true and user object when authenticated
      - name: Dashboard metrics and trends
        endpoint: GET /api/dashboard-metrics and GET /api/dashboard-trends
        expected: chart payload arrays and metrics object
      - name: Profile read and update
        endpoint: GET /api/profile-data/{id} and POST /api/profile
        expected: updated profile reflected in response
      - name: Friends search and requests
        endpoint: GET /api/users/search, POST /api/friend-request/send, GET /api/friend-requests, POST /api/friend-request/respond
        expected: request lifecycle transitions pending to accepted/rejected
      - name: Friends list refresh
        endpoint: GET /api/friends
        expected: accepted friend appears in list

  notes:
    - Login, registration, and onboarding endpoints intentionally excluded from Member 1 scope.
    - /api/dashboard and /api/profile are shell endpoints; frontend relies primarily on data endpoints.
