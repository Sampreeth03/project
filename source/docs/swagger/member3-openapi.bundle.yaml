openapi: 3.0.3
info:
  title: RELABTeams Member 3 Job and Recruiter APIs
  version: 1.0.0
  description: Bundled OpenAPI file for Member 3 recruiter and job endpoints.
servers:
  - url: http://localhost:5000
tags:
  - name: Member3-Recruiter
    description: Recruiter dashboard and job management APIs
  - name: Member3-RecruiterAdmin
    description: Admin recruiter management APIs consumed by recruiter workflows
  - name: Member3-RecAuth
    description: Recruiter signup and OTP verification APIs
  - name: Member3-Job
    description: Student job application and notification APIs
paths:
  /api/recruiter-home:
    get:
      tags: [Member3-Recruiter]
      summary: Get recruiter home payload
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recruiter home data
        '403':
          description: Recruiter access required

  /api/rec-job:
    get:
      tags: [Member3-Recruiter]
      summary: Get recruiter job management data
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recruiter jobs and metrics

  /api/recruiter-dashboard:
    get:
      tags: [Member3-Recruiter]
      summary: Get recruiter dashboard metrics
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterDashboardResponse'

  /api/recruiter-dashboard-trends:
    get:
      tags: [Member3-Recruiter]
      summary: Get recruiter trend and hiring pipeline analytics
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Trend payload

  /api/rec-app:
    get:
      tags: [Member3-Recruiter]
      summary: Get recruiter applications feed
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Applications list

  /api/rec-not:
    get:
      tags: [Member3-Recruiter]
      summary: Get recruiter notifications
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Notification list

  /api/admin-rec:
    get:
      tags: [Member3-RecruiterAdmin]
      summary: Recruiters management shell endpoint
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recruiters shell rendered successfully
      x-implemented-by:
        controller: source/controllers/adminController.js#getRecruitersPage
        route: source/routes/adminRoutes.js

  /api/admin-rec/data:
    get:
      tags: [Member3-RecruiterAdmin]
      summary: Fetch recruiters analytics data
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recruiters data fetched
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      x-implemented-by:
        controller: source/controllers/adminController.js#getRecruitersData
        route: source/routes/adminRoutes.js

  /api/create-recruiter-job:
    post:
      tags: [Member3-Recruiter]
      summary: Create recruiter job posting
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterJobCreateRequest'
      responses:
        '200':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '403':
          description: Forbidden or recruiter not verified

  /api/delete-recruiter-job/{id}:
    delete:
      tags: [Member3-Recruiter]
      summary: Delete recruiter job posting
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job deleted
        '404':
          description: Not found

  /api/toggle-job-active/{id}:
    patch:
      tags: [Member3-Recruiter]
      summary: Activate/deactivate recruiter job posting
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  oneOf:
                    - type: boolean
                    - type: integer
                      enum: [0, 1]
      responses:
        '200':
          description: Updated

  /api/view-resume/{id}:
    get:
      tags: [Member3-Recruiter]
      summary: View applicant resume
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resume stream
        '404':
          description: Resume not found

  /api/update-application-status/{id}:
    patch:
      tags: [Member3-Recruiter]
      summary: Update application status by path id
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequest'
      responses:
        '200':
          description: Updated

  /api/update-application-status:
    post:
      tags: [Member3-Recruiter]
      summary: Update application status using body applicationId
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequest'
      responses:
        '200':
          description: Updated

  /api/user-profile-for-recruiter/{userId}:
    get:
      tags: [Member3-Recruiter]
      summary: Fetch applicant profile visible to recruiter
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile response
        '403':
          description: Forbidden

  /api/signupforrec:
    get:
      tags: [Member3-RecAuth]
      summary: Recruiter signup API health endpoint
      responses:
        '200':
          description: Recruiter signup API operational status

  /api/recruiter-signup:
    post:
      tags: [Member3-RecAuth]
      summary: Legacy recruiter signup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, password, confirmPassword]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                confirmPassword:
                  type: string
                objectFile:
                  type: string
                  format: binary
      responses:
        '201':
          description: Recruiter account created
        '400':
          description: Validation failure
        '409':
          description: Email already used

  /api/recruiter/signup/init:
    post:
      tags: [Member3-RecAuth]
      summary: Initialize recruiter OTP signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, confirmPassword]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: OTP sent
        '400':
          description: Validation failure
        '409':
          description: Email already used
        '429':
          description: OTP rate-limited

  /api/recruiter/signup/verify-otp:
    post:
      tags: [Member3-RecAuth]
      summary: Verify recruiter signup OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        '200':
          description: OTP verified
        '400':
          description: OTP invalid or malformed
        '404':
          description: Pending signup not found

  /api/recruiter/signup/resend-otp:
    post:
      tags: [Member3-RecAuth]
      summary: Resend recruiter signup OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP resent
        '400':
          description: Missing email
        '404':
          description: Pending signup not found
        '429':
          description: OTP rate-limited

  /api/recruiter/signup/complete:
    post:
      tags: [Member3-RecAuth]
      summary: Complete recruiter signup after OTP verification
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, objectFile]
              properties:
                email:
                  type: string
                  format: email
                objectFile:
                  type: string
                  format: binary
      responses:
        '201':
          description: Recruiter account created and logged in
        '400':
          description: Missing email or document
        '404':
          description: Signup session invalid or OTP not verified

  /api/apply:
    get:
      tags: [Member3-Job]
      summary: Get active jobs for student apply page
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Job listings

  /api/job:
    get:
      tags: [Member3-Job]
      summary: Get student job applications
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Student applications

  /api/job_not:
    get:
      tags: [Member3-Job]
      summary: Get student job notifications
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Notifications

  /api/apply-job:
    post:
      tags: [Member3-Job]
      summary: Apply for job with resume and custom answers
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [jobId, resume]
              properties:
                jobId:
                  type: string
                resume:
                  type: string
                  format: binary
                customAnswers:
                  type: string
                  description: JSON string map of custom answers
      responses:
        '200':
          description: Application submitted
        '400':
          description: Validation or duplicate apply error

  /api/mark-notification-read:
    post:
      tags: [Member3-Job]
      summary: Mark notification as read
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationRequest'
      responses:
        '200':
          description: Updated

  /api/delete-notification:
    post:
      tags: [Member3-Job]
      summary: Delete notification
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkNotificationRequest'
      responses:
        '200':
          description: Deleted

  /api/revoke-application:
    delete:
      tags: [Member3-Job]
      summary: Revoke student job application
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeApplicationRequest'
      responses:
        '200':
          description: Revoked
        '400':
          description: Cannot revoke shortlisted application

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    RecruiterDashboardResponse:
      type: object
      properties:
        user:
          type: object
        totalJobs:
          type: integer
        totalParticipants:
          type: integer
        approvedApplications:
          type: integer
        pendingApplications:
          type: integer
        rejectedApplications:
          type: integer
        hiringSuccessRate:
          type: integer
    RecruiterJobCreateRequest:
      type: object
      required: [jobTitle, companyName, description, salaryRange, skills]
      properties:
        jobTitle:
          type: string
        companyName:
          type: string
        description:
          type: string
        salaryRange:
          type: string
        skills:
          type: string
        customQuestions:
          type: array
          items:
            type: string
    UpdateApplicationStatusRequest:
      type: object
      properties:
        applicationId:
          type: string
        status:
          type: string
          enum: [Approved, Rejected]
        statusLc:
          type: string
          enum: [approved, rejected]
    MarkNotificationRequest:
      type: object
      required: [notificationId]
      properties:
        notificationId:
          type: string
    RevokeApplicationRequest:
      type: object
      required: [applicationId]
      properties:
        applicationId:
          type: string
    GenericSuccess:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    GenericError:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
