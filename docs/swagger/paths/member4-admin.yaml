        route: source/routes/adminRoutes.js
      x-frontend-consumers:
        - client/src/store/adminSlice.js
        - client/src/components/Admin/AdminAdministrators.jsx

    post:
      tags: [Admin]
      summary: Create a new platform administrator
      operationId: createPlatformAdministrator
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/member4-schemas.yaml#/components/schemas/CreatePlatformAdminRequest
      responses:
        '201':
          description: Administrator created.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/CreatePlatformAdminResponse
        '400':
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/ErrorResponse
        '409':
          description: Duplicate email or adminId.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/ErrorResponse
