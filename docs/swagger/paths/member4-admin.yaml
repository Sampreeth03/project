paths:
  /admin:
    get:
      tags: [Admin]
      summary: Admin dashboard shell endpoint
      description: Returns the admin dashboard shell for server-rendered fallback.
      operationId: getAdminDashboardShell
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dashboard shell rendered successfully.
      x-implemented-by:
        controller: source/controllers/adminController.js#getAdminDashboard
        route: source/routes/adminRoutes.js
      x-frontend-consumers:
        - client/src/App.jsx

  /admin/dashboard-data:
    get:
      tags: [Admin]
      summary: Fetch dashboard metrics data
      operationId: getAdminDashboardData
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dashboard metrics payload.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/AdminDashboardResponse
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: ../components/member4-schemas.yaml#/components/schemas/ErrorResponse
      x-implemented-by:
        controller: source/controllers/adminController.js#getDashboardData
        route: source/routes/adminRoutes.js
      x-frontend-consumers:
        - client/src/store/adminSlice.js
        - client/src/components/Admin/AdminDashboard.jsx

